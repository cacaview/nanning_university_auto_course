[project]
name = "nanning-university-auto-course"
version = "0.1.0"
description = "本地验证码 OCR 服务"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flask>=3.0,<4",
    "numpy<2",
    "onnxruntime>=1.17,<1.24",
    "opencv-python>=4.8,<5",
    "pillow>=10,<13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
